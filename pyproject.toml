[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-control-tower"
version = "1.0.0"
description = "Client-ready inventory replenishment and risk intelligence control tower"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<7.0",
  "streamlit>=1.50,<2.0",
  "Pillow>=10.0,<13.0",
]

[tool.setuptools.packages.find]
include = ["inventory_optimizer*"]
